name: docudis
description: "Docudis: free, on-device document anonymization."
publish_to: 'none'
version: 0.1.2+4

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.3.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.8.5
  flutter_riverpod: ^3.4.3
  google_mlkit_entity_extraction: ^0.17.1
  google_mlkit_language_id: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.6.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  docudis_engine:
    path: packages/docudis_engine
  docudis_ffi:
    git:
      url: https://github.com/stonetech-pxia/docudis-core.git
      ref: 8743fd84bc16ba90e5dae70ec97b580ab5171a89
      path: bindings/dart
  docudis_pdf:
    path: packages/docudis_pdf
  xml: ^7.0.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The NER model is NOT a Flutter asset: it ships as an Android asset pack
    # (android/model_pack) / debug source set, see lib/anonymize/model/model_locator.dart.
    - benchmark/ner_cases.json
    - benchmark/ocr_cases.json
    - benchmark/ocr/ground_truth/
    - benchmark/ocr/images/
    - assets/ai_logos/
    - benchmark/ocr/images/documents/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora[wght].ttf
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla[wght].ttf
        - asset: assets/fonts/Karla-Italic[wght].ttf
          style: italic
